name: Feature request
description: Suggest an improvement to the product or developer experience.
title: "[Feature]: "
labels: []
assignees: []

body:
  - type: textarea
    id: problem
    attributes:
      label: Problem or opportunity
      description: What user or contributor need would this address?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed change
      description: Describe the outcome, not only a specific implementation.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: What workarounds or other approaches did you consider?

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Add mockups, examples, or links when useful.

  - type: checkboxes
    id: checks
    attributes:
      label: Submission checks
      options:
        - label: I searched existing issues for similar requests.
          required: true
        - label: I agree to follow the Code of Conduct.
          required: true
